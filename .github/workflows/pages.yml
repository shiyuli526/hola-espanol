name: Publish Hola Español
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily Spanish reading']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hola-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p public
          cp index.html daily.json sw.js manifest.json icon-192.png icon-512.png public/
          cp -r covers public/
          if [ -d audio ]; then cp -r audio public/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
