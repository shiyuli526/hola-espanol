const raw=[["巴塞罗那的早餐", "A1", "Cada mañana desayuno en casa.|每天早晨我在家吃早餐。;Después voy a una cafetería cerca de la universidad.|然后我去大学附近的一家咖啡馆。;Pido un café y una tostada.|我点一杯咖啡和一份烤面包。;En mi barrio hay una cafetería pequeña.|我住的街区有一家小咖啡馆。;La dueña se llama Ana y siempre saluda a los clientes.|老板娘叫安娜，总是向顾客打招呼。;A las ocho, muchas personas compran pan antes de trabajar.|八点钟，许多人上班前买面包。;Yo prefiero sentarme cerca de la ventana.|我更喜欢坐在窗边。;Un día a la semana desayuno con una amiga.|每周有一天我和一位朋友一起吃早餐。;Hablamos un poco y después vamos a clase.|我们聊一会儿，然后去上课。;Me gusta empezar el día sin prisa.|我喜欢不慌不忙地开始一天。", "mañana:早晨,desayuno:我吃早餐,casa:家,después:之后,voy:我去,cafetería:咖啡馆,cerca:附近,universidad:大学,pido:我点餐,café:咖啡,tostada:烤面包,barrio:街区,pequeña:小的,dueña:女店主,llama:叫作,siempre:总是,saluda:打招呼,clientes:顾客,ocho:八,personas:人,compran:购买,pan:面包,antes:之前,trabajar:工作,prefiero:我更喜欢,sentarme:坐下,ventana:窗户,semana:周,amiga:女性朋友,hablamos:我们聊天,vamos:我们去,empezar:开始,prisa:匆忙", "¿Qué pido?|Un café y una tostada.|Una sopa.|Un té.", "ir a + 地点：去某处；pedir：点餐。"], ["去超市", "A1", "Hoy voy al supermercado.|今天我去超市。;Necesito comprar leche, huevos y fruta.|我需要买牛奶、鸡蛋和水果。;Pago con tarjeta.|我用银行卡付款。;Antes de salir, hago una lista de la compra.|出门前，我列一张购物清单。;En el supermercado hay muchas frutas de temporada.|超市里有很多时令水果。;Las manzanas están cerca de las naranjas.|苹果在橙子附近。;Miro los precios porque quiero ahorrar dinero.|我看看价格，因为我想省钱。;También compro arroz y verduras para la cena.|我还买米和蔬菜做晚饭。;En la caja hay tres personas delante de mí.|收银台前有三个人排在我前面。;La cajera me pregunta si necesito una bolsa.|收银员问我是否需要袋子。;Tengo una bolsa en mi mochila.|我的背包里有一个袋子。", "hoy:今天,supermercado:超市,necesito:我需要,comprar:购买,leche:牛奶,huevos:鸡蛋,fruta:水果,pago:我付款,tarjeta:卡,salir:出门,hago:我做,lista:清单,compra:购物,muchas:很多,frutas:水果,temporada:季节,manzanas:苹果,naranjas:橙子,miro:我看,precios:价格,porque:因为,quiero:我想,ahorrar:节省,dinero:钱,compro:我买,arroz:米,verduras:蔬菜,cena:晚饭,caja:收银台,delante:前面,mí:我,cajera:收银员,pregunta:询问,bolsa:袋子,mochila:背包", "¿Cómo pago?|Con tarjeta.|En efectivo.|No pago.", "necesitar + 动词原形：需要做某事。"], ["坐地铁上学", "A1", "Vivo en Barcelona.|我住在巴塞罗那。;Cada día tomo el metro para ir a clase.|我每天坐地铁去上课。;Bajo en la estación cerca de mi escuela.|我在学校附近的车站下车。;Salgo de casa a las ocho de la mañana.|我早上八点出门。;La entrada del metro está a cinco minutos de mi casa.|地铁入口离我家五分钟路程。;Uso mi tarjeta de transporte para entrar.|我使用交通卡进站。;En el andén espero unos minutos.|我在站台等几分钟。;Por la mañana hay mucha gente en el tren.|早上车里有很多人。;A veces no encuentro un asiento, pero puedo leer en el móvil.|有时候我找不到座位，但可以用手机阅读。;Cuando llego a mi estación, salgo y camino hasta la universidad.|到站后，我出站步行到大学。;El viaje dura unos veinte minutos.|行程大约二十分钟。", "vivo:我居住,día:天,tomo:我乘坐,metro:地铁,clase:课程,bajo:我下车,estación:车站,escuela:学校,salgo:我出门,ocho:八,entrada:入口,está:位于,minutos:分钟,uso:我使用,tarjeta:卡,transporte:交通,entrar:进入,andén:站台,espero:我等待,gente:人群,tren:列车,veces:次数,encuentro:我找到,asiento:座位,puedo:我可以,leer:阅读,móvil:手机,llego:我到达,camino:我步行,hasta:直到,universidad:大学,viaje:行程,dura:持续,veinte:二十", "¿Qué transporte tomo?|El metro.|El avión.|El taxi.", "para + 动词原形：为了做某事。"], ["我的一天", "A1", "Me levanto a las siete.|我七点起床。;Trabajo por la mañana y estudio por la tarde.|我上午工作，下午学习。;Por la noche leo un libro.|晚上我读一本书。", "levanto:起床,siete:七,trabajo:我工作,estudio:我学习,tarde:下午,noche:晚上,leo:我阅读,libro:书", "¿A qué hora me levanto?|A las siete.|A las diez.|A las nueve.", "levantarse 是自复动词：me levanto。"], ["打网球", "A1", "Me gusta jugar al tenis.|我喜欢打网球。;Juego con mi hermana los jueves.|每周四我和姐姐或妹妹一起打球。;Después bebemos agua y volvemos a casa.|然后我们喝水并回家。", "gusta:喜欢,jugar:玩,juego:我打球,tenis:网球,hermana:姐妹,jueves:星期四,bebemos:我们喝,agua:水,volvemos:我们返回", "¿Cuándo juego?|Los jueves.|Los lunes.|Los domingos.", "me gusta + 动词原形；jugar al tenis。"], ["领取快递", "A1", "Tengo un paquete en correos.|我在邮局有一个包裹。;La empleada me pide el pasaporte.|工作人员请我出示护照。;Firmo y recibo mi paquete.|我签字并收到包裹。", "tengo:我有,paquete:包裹,correos:邮局,empleada:女工作人员,pide:要求,pasaporte:护照,firmo:我签字,recibo:我收到", "¿Qué documento necesito?|El pasaporte.|Un libro.|Una receta.", "tener 的第一人称是 tengo。"], ["在餐厅点餐", "A1", "Quiero una mesa para dos personas.|我想要一张两人桌。;Pido una sopa y un vaso de agua.|我点一份汤和一杯水。;Al final pido la cuenta.|最后我要求结账。", "quiero:我想要,mesa:桌子,dos:二,personas:人,sopa:汤,vaso:杯子,final:最后,cuenta:账单", "¿Qué pido al final?|La cuenta.|La carta.|Un café.", "Quiero + 名词：我想要……。"], ["周末旅行", "A2", "El sábado pasado fui a un pueblo cerca del mar.|上周六我去了海边附近的一个小镇。;Hacía sol y paseé por las calles del centro.|天气晴朗，我在市中心街道散步。;Me gustaría volver el próximo mes.|我想下个月再去。;Salí de casa temprano porque quería aprovechar el día.|我很早出门，因为想充分利用这一天。;Al llegar, encontré una plaza con varias terrazas.|抵达后，我发现一个有几家露天餐座的广场。;Tomé un café mientras miraba el mar.|我一边看海一边喝咖啡。;Después visité una tienda de productos locales.|之后我逛了一家卖当地产品的店。;El dueño me explicó cómo llegar a una playa tranquila.|店主告诉我如何到达一个安静的海滩。;Caminé durante media hora y saqué algunas fotos.|我走了半小时，拍了一些照片。;Por la tarde regresé a Barcelona en tren.|下午我坐火车返回巴塞罗那。;Fue una excursión sencilla, pero me ayudó a descansar.|这是一次简单的短途旅行，但让我得到了休息。", "sábado:星期六,pasado:过去的,fui:我去了,pueblo:小镇,mar:海,hacía:当时天气,paseé:我散步,calles:街道,volver:返回,próximo:下一个,mes:月,salí:我出门,temprano:早,quería:我当时想,aprovechar:充分利用,llegar:到达,encontré:我发现,plaza:广场,varias:几个,terrazas:露天餐座,tomé:我喝了,mientras:当……时,miraba:我当时看着,visité:我参观了,tienda:商店,productos:产品,locales:当地的,dueño:店主,explicó:解释了,playa:海滩,tranquila:安静的,caminé:我步行了,durante:持续,media:半,hora:小时,saqué:我拍了,fotos:照片,regresé:我返回了,tren:火车,fue:是,excursión:短途旅行,sencilla:简单的,ayudó:帮助了,descansar:休息", "¿Adónde fui?|A un pueblo.|A otro país.|Al hospital.", "fui、paseé 表示过去完成的动作；me gustaría 表示委婉愿望。"], ["和导师开会", "A2", "Ayer tuve una reunión con mi tutor.|昨天我和导师开了会。;Hablamos de los resultados y de los próximos pasos.|我们讨论了结果和下一步。;Tengo que preparar un informe antes del viernes.|我必须在周五之前准备一份报告。", "ayer:昨天,tuve:我有过,reunión:会议,tutor:导师,hablamos:我们谈论,resultados:结果,pasos:步骤,preparar:准备,informe:报告,antes:之前,viernes:星期五", "¿Qué tengo que preparar?|Un informe.|Un function answer(n){quizAnswer=n;if(n!==1&&!wrong.includes(idx))wrong.push(idx);if(n===1)wrong=wrong.filter(i=>i!==idx);write('holaWrong',wrong);render()}const starterLex={"internacional": {"meaning": "国际的", "en": "international", "es": "Relacionado con varios países.", "lemma": "internacional", "pos": "adjetivo"}, "estudio": {"meaning": "研究", "en": "study", "es": "Investigación sobre un tema.", "lemma": "estudio", "pos": "sustantivo masculino"}, "nuevo": {"meaning": "新的", "en": "new", "es": "Que es reciente.", "lemma": "nuevo", "pos": "adjetivo"}, "analiza": {"meaning": "分析", "en": "analyzes", "es": "Examina algo con atención.", "lemma": "analizar", "pos": "verbo"}, "acción": {"meaning": "行为；行动", "en": "action", "es": "Acto de hacer algo.", "lemma": "acción", "pos": "sustantivo femenino"}, "plantar": {"meaning": "种植", "en": "to plant", "es": "Poner una planta en la tierra.", "lemma": "plantar", "pos": "verbo"}, "árboles": {"meaning": "树木", "en": "trees", "es": "Plantas con tronco leñoso.", "lemma": "árbol", "pos": "sustantivo masculino plural"}, "trabajan": {"meaning": "工作", "en": "work", "es": "Realizan una actividad laboral.", "lemma": "trabajar", "pos": "verbo"}, "equipo": {"meaning": "团队", "en": "team", "es": "Grupo de personas que colaboran.", "lemma": "equipo", "pos": "sustantivo masculino"}, "incendios": {"meaning": "火灾", "en": "fires", "es": "Fuegos que se extienden sin control.", "lemma": "incendio", "pos": "sustantivo masculino plural"}, "aumentar": {"meaning": "增加", "en": "to increase", "es": "Hacer algo mayor.", "lemma": "aumentar", "pos": "verbo"}, "regiones": {"meaning": "地区", "en": "regions", "es": "Zonas de un territorio.", "lemma": "región", "pos": "sustantivo femenino plural"}, "científicos": {"meaning": "科学家", "en": "scientists", "es": "Personas que investigan científicamente.", "lemma": "científico", "pos": "sustantivo masculino plural"}, "investigación": {"meaning": "研究", "en": "research", "es": "Estudio para obtener conocimiento.", "lemma": "investigación", "pos": "sustantivo femenino"}, "revista": {"meaning": "期刊；杂志", "en": "journal; magazine", "es": "Publicación periódica.", "lemma": "revista", "pos": "sustantivo femenino"}, "superficie": {"meaning": "面积；表面", "en": "area; surface", "es": "Extensión de un terreno.", "lemma": "superficie", "pos": "sustantivo femenino"}, "riesgo": {"meaning": "风险", "en": "risk", "es": "Posibilidad de daño.", "lemma": "riesgo", "pos": "sustantivo masculino"}, "biblioteca": {"meaning": "图书馆", "en": "library", "es": "Lugar donde se conservan y consultan libros.", "lemma": "biblioteca", "pos": "sustantivo femenino"}, "libros": {"meaning": "书籍", "en": "books", "es": "Obras escritas o impresas.", "lemma": "libro", "pos": "sustantivo masculino plural"}, "documentos": {"meaning": "文献；文件", "en": "documents", "es": "Textos que contienen información.", "lemma": "documento", "pos": "sustantivo masculino plural"}};function filterWords(q){document.getElementById('wordlist').innerHTML=Object.entries(saved).filter(([k,v])=>[k,v.meaning,v.en,v.es,v.lemma].join(' ').toLowerCase().includes(q.toLowerCase())).map(([k,v])=>`<div class="panel"><button class="item" data-saved="${esc(k)}">${esc(k)} · ${esc(v.meaning||'')}</button><p>${esc(v.en||'英文待补充')}</p><p class="muted">${esc(v.es||'西语释义待补充')}</p><div class="muted">${esc(v.example||'')}</div></div>`).join('')||'暂无匹配单词'}
function lookup(w,fromSaved=false){let k=w.toLowerCase(),a=articles[idx],pair=!fromSaved?a?.pairs.find(p=>p[0].toLowerCase().split(/[^\p{L}]+/u).includes(k)):null,entry={...starterLex[k],...(!fromSaved?a?.lexicon?.[k]:null),...saved[k]},meaning=entry.meaning||(!fromSaved?a?.dict?.[k]:null)||basic[k]||'',example=entry.example||pair?.[0]||'',exampleCN=entry.exampleCN||pair?.[1]||'';detail.innerHTML=`<h2>${esc(w)}</h2><button id="speakword">▶ 发音</button><p class="muted">${esc(entry.lemma||w)} · ${esc(entry.pos||'词性待补充')}</p><label>中文释义<input id="meaning" value="${esc(meaning)}" placeholder="暂未收录"></label><label>English<input id="worden" value="${esc(entry.en||'')}" placeholder="暂未收录"></label><label>Definición en español<textarea id="wordes" placeholder="暂未收录">${esc(entry.es||'')}</textarea></label><p>${esc(example)}</p><p class="muted">${esc(exampleCN)}</p><div class="bar"><button id="saveword" class="primary">${saved[k]?'更新单词':'加入单词本'}</button>${saved[k]?'<button id="deleteword">删除</button>':''}</div>`;detail.querySelector('#speakword').onclick=()=>say(w);detail.querySelector('#saveword').onclick=()=>{let m=document.getElementById('meaning').value.trim();if(!m){alert('请填写释义');return}saved[k]={...entry,meaning:m,en:document.getElementById('worden').value.trim(),es:document.getElementById('wordes').value.trim(),example,exampleCN};write('holaWords',saved);modal.close();render()};let d=detail.querySelector('#deleteword');if(d)d.onclick=()=>{delete saved[k];write('holaWords',saved);modal.close();render()};modal.showModal()}
app.addEventListener('click',e=>{let t=e.target.closest('[data-word],[data-saved]');if(t)lookup(t.dataset.word||t.dataset.saved,!!t.dataset.saved)});app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.word)lookup(e.target.dataset.word)});function grade(ok){let k=Object.keys(saved).find(k=>!saved[k].due||saved[k].due<=Date.now());if(!k)return;let s=saved[k];s.stage=ok?(s.stage||0)+1:0;s.due=Date.now()+(ok?[1,3,7,14,30][Math.min(s.stage-1,4)]*86400000:600000);write('holaWords',saved);reviewReveal=false;render()}function addArticle(){let title=document.getElementById('title').value.trim(),pairs=document.getElementById('pairs').value.trim().split('\n').filter(Boolean).map(l=>l.split('|').map(s=>s.trim())),dict=Object.fromEntries(document.getElementById('dict').value.split('\n').filter(l=>l.includes('|')).map(l=>l.split('|').map(s=>s.trim())));if(!title||!pairs.length||pairs.some(p=>p.length!==2||!p[0]||!p[1])){alert('请填写标题和正确的双语行');return}custom.push({title,level:document.getElementById('level').value,pairs,dict});write('holaCustom',custom);load();level='全部';go('home')}function backup(){let b=new Blob([JSON.stringify({version:2,saved,done,wrong,custom},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hola-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.saved||!Array.isArray(x.custom)||!Array.isArray(x.done)||!Array.isArray(x.wrong))throw Error();if(!confirm('恢复将覆盖当前学习记录，继续？'))return;saved=x.saved;custom=x.custom;done=x.done.map(i=>!x.version&&i>=12?i+8:i);wrong=x.wrong.map(i=>!x.version&&i>=12?i+8:i);for(let [k,v] of Object.entries({holaWords:saved,holaCustom:custom,holaDone:done,holaWrong:wrong}))write(k,v);load();render()}catch{alert('备份格式不正确')}}render();if('speechSynthesis' in window)speechSynthesis.getVoices();fetch('daily.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return
