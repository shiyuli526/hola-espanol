const raw=[

['去超市','A1','Hoy voy al supermercado.|今天我去超市。;Necesito comprar leche, huevos y fruta.|我需要买牛奶、鸡蛋和水果。;Pago con tarjeta.|我用银行卡付款。','hoy:今天,supermercado:超市,necesito:我需要,comprar:购买,leche:牛奶,huevos:鸡蛋,fruta:水果,pago:我付款,tarjeta:卡','¿Cómo pago?|Con tarjeta.|En efectivo.|No pago.','necesitar + 动词原形：需要做某事。'],
['坐地铁上学','A1','Vivo en Barcelona.|我住在巴塞罗那。;Cada día tomo el metro para ir a clase.|我每天坐地铁去上课。;Bajo en la estación cerca de mi escuela.|我在学校附近的车站下车。','vivo:我居住,día:天,tomo:我乘坐,metro:地铁,clase:课程,bajo:我下车,estación:车站,escuela:学校','¿Qué transporte tomo?|El metro.|El avión.|El taxi.','para + 动词原形：为了做某事。'],

['打网球','A1','Me gusta jugar al tenis.|我喜欢打网球。;Juego con mi hermana los jueves.|每周四我和姐姐或妹妹一起打球。;Después bebemos agua y volvemos a casa.|然后我们喝水并回家。','gusta:喜欢,jugar:玩,juego:我打球,tenis:网球,hermana:姐妹,jueves:星期四,bebemos:我们喝,agua:水,volvemos:我们返回','¿Cuándo juego?|Los jueves.|Los lunes.|Los domingos.','me gusta + 动词原形；jugar al tenis。'],
['领取快递','A1','Tengo un paquete en correos.|我在邮局有一个包裹。;La empleada me pide el pasaporte.|工作人员请我出示护照。;Firmo y recibo mi paquete.|我签字并收到包裹。','tengo:我有,paquete:包裹,correos:邮局,empleada:女工作人员,pide:要求,pasaporte:护照,firmo:我签字,recibo:我收到','¿Qué documento necesito?|El pasaporte.|Un libro.|Una receta.','tener 的第一人称是 tengo。'],
['在餐厅点餐','A1','Quiero una mesa para dos personas.|我想要一张两人桌。;Pido una sopa y un vaso de agua.|我点一份汤和一杯水。;Al final pido la cuenta.|最后我要求结账。','quiero:我想要,mesa:桌子,dos:二,personas:人,sopa:汤,vaso:杯子,final:最后,cuenta:账单','¿Qué pido al final?|La cuenta.|La carta.|Un café.','Quiero + 名词：我想要……。'],
['周末旅行','A2','El sábado pasado fui a un pueblo cerca del mar.|上周六我去了海边附近的一个小镇。;Hacía sol y paseé por las calles del centro.|天气晴朗，我在市中心街道散步。;Me gustaría volver el próximo mes.|我想下个月再去。','sábado:星期六,pasado:过去的,fui:我去了,pueblo:小镇,mar:海,hacía:当时天气,paseé:我散步,calles:街道,volver:返回,próximo:下一个,mes:月','¿Adónde fui?|A un pueblo.|A otro país.|Al hospital.','fui、paseé 表示过去完成的动作；me gustaría 表示委婉愿望。'],
['和导师开会','A2','Ayer tuve una reunión con mi tutor.|昨天我和导师开了会。;Hablamos de los resultados y de los próximos pasos.|我们讨论了结果和下一步。;Tengo que preparar un informe antes del viernes.|我必须在周五之前准备一份报告。','ayer:昨天,tuve:我有过,reunión:会议,tutor:导师,hablamos:我们谈论,resultados:结果,pasos:步骤,preparar:准备,informe:报告,antes:之前,viernes:星期五','¿Qué tengo que preparar?|Un informe.|Una cena.|Un billete.','tener que + 动词原形：必须做某事。'],

const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{alert('当前浏览器无法保存数据')}};let custom=read('holaCustom',[]),saved=read('holaWords',{}),done=read('holaDone',[]),wrong=read('holaWrong',[]),articles=[],page='home',idx=0,showCN=true,rate=1,level='全部',quizAnswer=null,reviewReveal=false;const app=document.getElementById('app'),modal=document.getElementById('modal'),detail=document.getElementById('detail');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!read('holaV2Migrated',false)){done=done.map(i=>i>=12?i+8:i);wrong=wrong.map(i=>i>=12?i+8:i);write('holaDone',done);write('holaWrong',wrong);write('holaV2Migrated',true)}function load(){articles=[...raw.map(r=>({title:r[0],level:r[1],pairs:r[2].split(';').map(p=>p.split('|')),dict:Object.fromEntries(r[3].split(',').map(p=>p.split(':'))),quiz:r[4].split('|'),grammar:r[5]})),...custom]}load();const basic={el:'定冠词（阳性）',la:'定冠词（阴性）',los:'定冠词（阳性复数）',las:'定冠词（阴性复数）',un:'一个',una:'一个',en:'在',de:'的；从',a:'到；向',y:'和',con:'和；用',mi:'我的',me:'我（代词）',por:'通过；在',para:'为了',que:'连接词；什么',no:'不',es:'是',hay:'有',al:'a + el',del:'de + el',cada:'每个',muy:'非常',más:'更多',se:'自复代词',si:'如果',también:'也',he:'助动词 haber',ha:'助动词 haber',ir:'去',ser:'是',estar:'处于',hacer:'做',tener:'拥有',te:'你（代词）',tu:'你的',su:'他的；您的',sus:'他们的',nos:'我们（代词）',lo:'它（代词）',o:'或者',pero:'但是',como:'像；如何',cuando:'当……时',qué:'什么',cómo:'怎样',dónde:'哪里',quién:'谁',todos:'所有',dos:'二',tres:'三',cinco:'五',mucho:'很多',bien:'好',sin:'没有',sobre:'关于；在上面',una:'一个'};function say(t){if(!('speechSynthesis'in window)){alert('此浏览器不支持朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=rate;let v=speechSynthesis.getVoices().find(v=>v.lang==='es-ES');if(v)u.voice=v;speechSynthesis.speak(u)}function go(p){page=p;reviewReveal=false;render();scrollTo(0,0)}function openArticle(i){idx=i;quizAnswer=null;go('read')}function tokens(s){return s.split(/([\p{L}]+(?:-[\p{L}]+)?)/u).map((w,i)=>i%2?`<span class="word" tabindex="0" role="button" data-word="${esc(w)}">${esc(w)}</span>`:esc(w)).join('')}function render(){document.getElementById('nav').innerHTML=[['home','阅读'],['words','单词本 '+Object.keys(saved).length],['review','复习'],['import','导入']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');let a=articles[idx];if(page==='home'){app.innerHTML=`<div class="panel"><h2>今天读一篇西语</h2><div class="muted">已学 ${done.length} / ${articles.length} 篇 · 收藏 ${Object.keys(saved).length} 词</div><div class="bar">${['全部','A1','A2','B1','B2','C1'].map(l=>`<button class="${l===level?'active':''}" onclick="level='${l}';render()">${l}</button>`).join('')}</div></div>${articles.map((a,i)=>level==='全部'||a.level===level?`<button class="item panel" onclick="openArticle(${i})"><span class="tag">${esc(a.level)}</span> ${done.includes(i)?'✓ ':''}${esc(a.title)}<p class="muted">${esc(a.pairs[0][0])}</p></button>`:'').join('')||'<p>此等级暂无文章，可导入。</p>'}`}
else if(page==='read'){app.innerHTML=`<button onclick="go('home')">‹ 文章列表</button><div class="panel" style="margin-top:12px"><span class="tag">${esc(a.level)}</span><h2>${esc(a.title)}</h2><div class="bar"><button onclick="say(articles[idx].pairs.map(p=>p[0]).join(' '))">▶ 全文</button><button onclick="if('speechSynthesis' in window)speechSynthesis.cancel()">停止</button><select aria-label="语速" onchange="rate=Number(this.value)">${[.5,.75,1,1.25].map(v=>`<option ${v===rate?'selected':''}>${v}</option>`).join('')}</select><button onclick="showCN=!showCN;render()">${showCN?'隐藏中文':'显示中文'}</button></div><div class="muted">点击任意西语单词查词、收藏；点击 ▶ 听单句。</div></div>${a.pairs.map((p,i)=>`<div class="panel"><button class="right" onclick="say(articles[idx].pairs[${i}][0])">▶</button><p class="es">${tokens(p[0])}</p>${showCN?`<p class="cn">${esc(p[1])}</p>`:''}</div>`).join('')}<div class="bar"><button onclick="go('quiz')">阅读测试</button><button onclick="go('grammar')">语法与重点词</button><button class="primary" onclick="if(!done.includes(idx)){done.push(idx);write('holaDone',done)};render()">${done.includes(idx)?'✓ 已学习':'标记已学习'}</button></div>`}
else if(page==='grammar'){app.innerHTML=`<button onclick="go('read')">‹ 返回文章</button><div class="panel"><h2>语法</h2>${esc(a.grammar||'导入文章暂无语法注释')}</div><div class="panel"><h2>重点词汇</h2>${Object.entries(a.dict).map(([k,v])=>`<button class="item" data-word="${esc(k)}">${esc(k)} · ${esc(v)}</button>`).join('')}</div>`}
else if(page==='quiz'){let q=a.quiz;if(!q){app.innerHTML='<button onclick="go(\'read\')">返回文章</button><p>导入文章暂无测试。</p>';return}let order=[1,2,3].sort((x,y)=>((x+idx)%3)-((y+idx)%3));app.innerHTML=`<button onclick="go('read')">‹ 返回文章</button><div class="panel"><h2>阅读测试</h2><p>${esc(q[0])}</p>${order.map(n=>`<button class="item ${quizAnswer===n?'active':''}" onclick="answer(${n})">${esc(q[n])}</button>`).join('')}${quizAnswer!==null?`<p class="${quizAnswer===1?'ok':'bad'}">${quizAnswer===1?'正确！':'正确答案：'+esc(q[1])}</p>`:''}</div>`}
else if(page==='words'){app.innerHTML=`<div class="panel"><h2>我的单词本</h2><input placeholder="搜索单词或中文" oninput="filterWords(this.value)"><div class="bar"><button onclick="backup()">导出备份</button><button onclick="document.getElementById('restore').click()">恢复备份</button><input type="file" id="restore" accept=".json" hidden onchange="restore(this)"></div><div id="wordlist"></div></div>`;filterWords('')}
else if(page==='review'){let keys=Object.keys(saved),k=keys.find(k=>!saved[k].due||saved[k].due<=Date.now());app.innerHTML=`<div class="panel"><h2>单词复习</h2>${k?`<h2>${esc(k)}</h2><button onclick="say(${JSON.stringify(k).replace(/"/g,'&quot;')})">▶ 发音</button><p>${reviewReveal?esc(saved[k].meaning):'先回忆中文含义'}</p>${reviewReveal?`<div class="bar"><button onclick="grade(false)">忘了</button><button onclick="grade(true)">记住了</button></div>`:'<button onclick="reviewReveal=true;render()">显示答案</button>'}`:'<p>没有到期的单词，先去阅读并收藏吧。</p>'}</div><div class="panel"><h2>错题本</h2>${wrong.map(i=>articles[i]?.quiz?`<button class="item" onclick="idx=${i};quizAnswer=null;go('quiz')">${esc(articles[i].quiz[0])}</button>`:'').join('')||'暂无错题'}</div>`}
else if(page==='import'){app.innerHTML=`<div class="panel"><h2>导入新文章</h2><p class="muted">每行一组西语 | 中文。可请 ChatGPT 生成此格式的原创文章。</p><input id="title" placeholder="文章标题"><select id="level">${['A1','A2','B1','B2','C1'].map(l=>`<option>${l}</option>`).join('')}</select><textarea id="pairs" placeholder="Hola, ¿qué tal? | 你好，最近怎么样？"></textarea><textarea id="dict" placeholder="可选词汇，每行：hola | 你好"></textarea><button class="primary" onclick="addArticle()">保存文章</button></div>`}}
function answer(n){quizAnswer=n;if(n!==1&&!wrong.includes(idx))wrong.push(idx);if(n===1)wrong=wrong.filter(i=>i!==idx);write('holaWrong',wrong);render()}function filterWords(q){document.getElementById('wordlist').innerHTML=Object.entries(saved).filter(([k,v])=>(k+' '+v.meaning).includes(q.toLowerCase())).map(([k,v])=>`<div class="panel"><button class="item" data-saved="${esc(k)}">${esc(k)} · ${esc(v.meaning)}</button><div class="muted">${esc(v.example||'')}</div></div>`).join('')||'暂无匹配单词'}function lookup(w,fromSaved=false){let k=w.toLowerCase(),a=articles[idx],meaning=saved[k]?.meaning||a?.dict[k]||basic[k]||'',example=saved[k]?.example||a?.pairs.find(p=>p[0].toLowerCase().split(/[^\p{L}]+/u).includes(k))?.[0]||'';detail.innerHTML=`<h2>${esc(w)}</h2><button id="speakword">▶ 发音</button><p class="muted">${meaning?'中文释义（可编辑）':'词库暂未收录，请手动填写释义'}</p><input id="meaning" value="${esc(meaning)}" placeholder="中文释义"><p class="muted">${esc(example)}</p><div class="bar"><button id="saveword" class="primary">${saved[k]?'更新单词':'加入单词本'}</button>${saved[k]?'<button id="deleteword">删除</button>':''}</div>`;detail.querySelector('#speakword').onclick=()=>say(w);detail.querySelector('#saveword').onclick=()=>{let m=document.getElementById('meaning').value.trim();if(!m){alert('请填写释义');return}saved[k]={...saved[k],meaning:m,example};write('holaWords',saved);modal.close();render()};let d=detail.querySelector('#deleteword');if(d)d.onclick=()=>{delete saved[k];write('holaWords',saved);modal.close();render()};modal.showModal()}app.addEventListener('click',e=>{let t=e.target.closest('[data-word],[data-saved]');if(t)lookup(t.dataset.word||t.dataset.saved,!!t.dataset.saved)});app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.word)lookup(e.target.dataset.word)});function grade(ok){let k=Object.keys(saved).find(k=>!saved[k].due||saved[k].due<=Date.now());if(!k)return;let s=saved[k];s.stage=ok?(s.stage||0)+1:0;s.due=Date.now()+(ok?[1,3,7,14,30][Math.min(s.stage-1,4)]*86400000:600000);write('holaWords',saved);reviewReveal=false;render()}function addArticle(){let title=document.getElementById('title').value.trim(),pairs=document.getElementById('pairs').value.trim().split('\n').filter(Boolean).map(l=>l.split('|').map(s=>s.trim())),dict=Object.fromEntries(document.getElementById('dict').value.split('\n').filter(l=>l.includes('|')).map(l=>l.split('|').map(s=>s.trim())));if(!title||!pairs.length||pairs.some(p=>p.length!==2||!p[0]||!p[1])){alert('请填写标题和正确的双语行');return}custom.push({title,level:document.getElementById('level').value,pairs,dict});write('holaCustom',custom);load();level='全部';go('home')}function backup(){let b=new Blob([JSON.stringify({version:2,saved,done,wrong,custom},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hola-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.saved||!Array.isArray(x.custom)||!Array.isArray(x.done)||!Array.isArray(x.wrong))throw Error();if(!confirm('恢复将覆盖当前学习记录，继续？'))return;saved=x.saved;custom=x.custom;done=x.done.map(i=>!x.version&&i>=12?i+8:i);wrong=x.wrong.map(i=>!x.version&&i>=12?i+8:i);for(let [k,v] of Object.entries({holaWords:saved,holaCustom:custom,holaDone:done,holaWrong:wrong}))write(k,v);load();render()}catch{alert('备份格式不正确')}}render();if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
