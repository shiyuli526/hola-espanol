const raw=[["巴塞罗那的早餐", "A1", "Cada mañana desayuno en casa.|每天早晨我在家吃早餐。;Después voy a una cafetería cerca de la universidad.|然后我去大学附近的一家咖啡馆。;Pido un café y una tostada.|我点一杯咖啡和一份烤面包。;En mi barrio hay una cafetería pequeña.|我住的街区有一家小咖啡馆。;La dueña se llama Ana y siempre saluda a los clientes.|老板娘叫安娜，总是向顾客打招呼。;A las ocho, muchas personas compran pan antes de trabajar.|八点钟，许多人上班前买面包。;Yo prefiero sentarme cerca de la ventana.|我更喜欢坐在窗边。;Un día a la semana desayuno con una amiga.|每周有一天我和一位朋友一起吃早餐。;Hablamos un poco y después vamos a clase.|我们聊一会儿，然后去上课。;Me gusta empezar el día sin prisa.|我喜欢不慌不忙地开始一天。", "mañana:早晨,desayuno:我吃早餐,casa:家,después:之后,voy:我去,cafetería:咖啡馆,cerca:附近,universidad:大学,pido:我点餐,café:咖啡,tostada:烤面包,barrio:街区,pequeña:小的,dueña:女店主,llama:叫作,siempre:总是,saluda:打招呼,clientes:顾客,ocho:八,personas:人,compran:购买,pan:面包,antes:之前,trabajar:工作,prefiero:我更喜欢,sentarme:坐下,ventana:窗户,semana:周,amiga:女性朋友,hablamos:我们聊天,vamos:我们去,empezar:开始,prisa:匆忙", "¿Qué pido?|Un café y una tostada.|Una sopa.|Un té.", "ir a + 地点：去某处；pedir：点餐。"], ["去超市", "A1", "Hoy voy al supermercado.|今天我去超市。;Necesito comprar leche, huevos y fruta.|我需要买牛奶、鸡蛋和水果。;Pago con tarjeta.|我用银行卡付款。;Antes de salir, hago una lista de la compra.|出门前，我列一张购物清单。;En el supermercado hay muchas frutas de temporada.|超市里有很多时令水果。;Las manzanas están cerca de las naranjas.|苹果在橙子附近。;Miro los precios porque quiero ahorrar dinero.|我看看价格，因为我想省钱。;También compro arroz y verduras para la cena.|我还买米和蔬菜做晚饭。;En la caja hay tres personas delante de mí.|收银台前有三个人排在我前面。;La cajera me pregunta si necesito una bolsa.|收银员问我是否需要袋子。;Tengo una bolsa en mi mochila.|我的背包里有一个袋子。", "hoy:今天,supermercado:超市,necesito:我需要,comprar:购买,leche:牛奶,huevos:鸡蛋,fruta:水果,pago:我付款,tarjeta:卡,salir:出门,hago:我做,lista:清单,compra:购物,muchas:很多,frutas:水果,temporada:季节,manzanas:苹果,naranjas:橙子,miro:我看,precios:价格,porque:因为,quiero:我想,ahorrar:节省,dinero:钱,compro:我买,arroz:米,verduras:蔬菜,cena:晚饭,caja:收银台,delante:前面,mí:我,cajera:收银员,pregunta:询问,bolsa:袋子,mochila:背包", "¿Cómo pago?|Con tarjeta.|En efectivo.|No pago.", "necesitar + 动词原形：需要做某事。"], ["坐地铁上学", "A1", "Vivo en Barcelona.|我住在巴塞罗那。;Cada día tomo el metro para ir a clase.|我每天坐地铁去上课。;Bajo en la estación cerca de mi escuela.|我在学校附近的车站下车。;Salgo de casa a las ocho de la mañana.|我早上八点出门。;La entrada del metro está a cinco minutos de mi casa.|地铁入口离我家五分钟路程。;Uso mi tarjeta de transporte para entrar.|我使用交通卡进站。;En el andén espero unos minutos.|我在站台等几分钟。;Por la mañana hay mucha gente en el tren.|早上车里有很多人。;A veces no encuentro un asiento, pero puedo leer en el móvil.|有时候我找不到座位，但可以用手机阅读。;Cuando llego a mi estación, salgo y camino hasta la universidad.|到站后，我出站步行到大学。;El viaje dura unos veinte minutos.|行程大约二十分钟。", "vivo:我居住,día:天,tomo:我乘坐,metro:地铁,clase:课程,bajo:我下车,estación:车站,escuela:学校,salgo:我出门,ocho:八,entrada:入口,está:位于,minutos:分钟,uso:我使用,tarjeta:卡,transporte:交通,entrar:进入,andén:站台,espero:我等待,gente:人群,tren:列车,veces:次数,encuentro:我找到,asiento:座位,puedo:我可以,leer:阅读,móvil:手机,llego:我到达,camino:我步行,hasta:直到,universidad:大学,viaje:行程,dura:持续,veinte:二十", "¿Qué transporte tomo?|El metro.|El avión.|El taxi.", "para + 动词原形：为了做某事。"], ["我的一天", "A1", "Me levanto a las siete.|我七点起床。;Trabajo por la mañana y estudio por la tarde.|我上午工作，下午学习。;Por la noche leo un libro.|晚上我读一本书。", "levanto:起床,siete:七,trabajo:我工作,estudio:我学习,tarde:下午,noche:晚上,leo:我阅读,libro:书", "¿A qué hora me levanto?|A las siete.|A las diez.|A las nueve.", "levantarse 是自复动词：me levanto。"], ["打网球", "A1", "Me gusta jugar al tenis.|我喜欢打网球。;Juego con mi hermana los jueves.|每周四我和姐姐或妹妹一起打球。;Después bebemos agua y volvemos a casa.|然后我们喝水并回家。", "gusta:喜欢,jugar:玩,juego:我打球,tenis:网球,hermana:姐妹,jueves:星期四,bebemos:我们喝,agua:水,volvemos:我们返回", "¿Cuándo juego?|Los jueves.|Los lunes.|Los domingos.", "me gusta + 动词原形；jugar al tenis。"], ["领取快递", "A1", "Tengo un paquete en correos.|我在邮局有一个包裹。;La empleada me pide el pasaporte.|工作人员请我出示护照。;Firmo y recibo mi paquete.|我签字并收到包裹。", "tengo:我有,paquete:包裹,correos:邮局,empleada:女工作人员,pide:要求,pasaporte:护照,firmo:我签字,recibo:我收到", "¿Qué documento necesito?| a cena.|Un billete.", "tener que + 动词原形：必须做某事。"], ["在药店", "A2", "Desde ayer me duele la garganta.|从昨天起我就喉咙痛。;Voy a la farmacia para pedir consejo.|我去药店寻求建议。;La farmacéutica me recomienda consultar al médico si no mejoro.|药剂师建议如果没有好转就去看医生。", "desde:从,duele:疼痛,garganta:喉咙,farmacia:药店,consejo:建议,farmacéutica:女药剂师,recomienda:建议,consultar:咨询,médico:医生,mejoro:我好转", "¿Qué me duele?|La garganta.|La pierna.|La mano.", "me duele + 单数名词：我的某处疼。"], ["租房", "A2", "Estoy buscando una habitación luminosa.|我正在找一间明亮的房间。;Antes de firmar el contrato, quiero conocer los gastos.|签合同前，我想了解各项费用。;También pregunto si puedo empadronarme.|我还询问是否可以办理住址登记。", "buscando:寻找,habitación:房间,luminosa:明亮的,firmar:签署,contrato:合同,gastos:费用,pregunto:我询问,empadronarme:办理住址登记", "¿Qué quiero conocer?|Los gastos.|El menú.|El horario del tren.", "estar + 副动词：正在做某事。"], ["学习西语", "A2", "Aunque entiendo algunas palabras, todavía me cuesta hablar.|虽然我能理解一些词，但说话仍有困难。;Intento escuchar español todos los días.|我试着每天听西语。;Cuando encuentro una palabra nueva, la apunto en mi cuaderno.|遇到新单词时，我把它记在笔记本里。;Al principio me daba vergüenza cometer errores.|起初我害怕犯错而感到不好意思。;Ahora intento hablar un poco con mis vecinos.|现在我试着和邻居聊几句。;Cuando escucho una frase útil, la repito varias veces.|听到实用的句子时，我会重复几遍。;También leo textos cortos sobre temas que me interesan.|我也阅读关于自己感兴趣的话题的短文。;No necesito entender cada palabra para comprender la idea principal.|我不需要懂每个单词就能理解主旨。;Después de leer, escribo un pequeño resumen sin mirar el texto.|读完后，我不看原文写一段小总结。;Los fines de semana repaso las palabras que he aprendido.|周末我复习学过的单词。;Poco a poco me siento más cómoda al hablar.|慢慢地，我说话时感觉更自在。", "aunque:虽然,entiendo:我理解,palabras:单词,todavía:仍然,cuesta:有困难,hablar:说话,intento:我尝试,escuchar:听,encuentro:我遇到,apunto:我记下,cuaderno:笔记本,principio:开始,daba:当时给予,vergüenza:羞怯,cometer:犯,errores:错误,ahora:现在,vecinos:邻居,escucho:我听,frase:句子,útil:实用的,repito:我重复,varias:若干,veces:次,leo:我阅读,textos:文本,cortos:短的,temas:主题,interesan:使感兴趣,necesito:我需要,entender:理解,comprender:理解,idea:想法,principal:主 function answer(n){quizAnswer=n;if(n!==1&&!wrong.includes(idx))wrong.push(idx);if(n===1)wrong=wrong.filter(i=>i!==idx);write('holaWrong',wrong);render()}const starterLex={"internacional": {"meaning": "国际的", "en": "international", "es": "Relacionado con varios países.", "lemma": "internacional", "pos": "adjetivo"}, "estudio": {"meaning": "研究", "en": "study", "es": "Investigación sobre un tema.", "lemma": "estudio", "pos": "sustantivo masculino"}, "nuevo": {"meaning": "新的", "en": "new", "es": "Que es reciente.", "lemma": "nuevo", "pos": "adjetivo"}, "analiza": {"meaning": "分析", "en": "analyzes", "es": "Examina algo con atención.", "lemma": "analizar", "pos": "verbo"}, "acción": {"meaning": "行为；行动", "en": "action", "es": "Acto de hacer algo.", "lemma": "acción", "pos": "sustantivo femenino"}, "plantar": {"meaning": "种植", "en": "to plant", "es": "Poner una planta en la tierra.", "lemma": "plantar", "pos": "verbo"}, "árboles": {"meaning": "树木", "en": "trees", "es": "Plantas con tronco leñoso.", "lemma": "árbol", "pos": "sustantivo masculino plural"}, "trabajan": {"meaning": "工作", "en": "work", "es": "Realizan una actividad laboral.", "lemma": "trabajar", "pos": "verbo"}, "equipo": {"meaning": "团队", "en": "team", "es": "Grupo de personas que colaboran.", "lemma": "equipo", "pos": "sustantivo masculino"}, "incendios": {"meaning": "火灾", "en": "fires", "es": "Fuegos que se extienden sin control.", "lemma": "incendio", "pos": "sustantivo masculino plural"}, "aumentar": {"meaning": "增加", "en": "to increase", "es": "Hacer algo mayor.", "lemma": "aumentar", "pos": "verbo"}, "regiones": {"meaning": "地区", "en": "regions", "es": "Zonas de un territorio.", "lemma": "región", "pos": "sustantivo femenino plural"}, "científicos": {"meaning": "科学家", "en": "scientists", "es": "Personas que investigan científicamente.", "lemma": "científico", "pos": "sustantivo masculino plural"}, "investigación": {"meaning": "研究", "en": "research", "es": "Estudio para obtener conocimiento.", "lemma": "in function lookup(w,fromSaved=false){stopAudio();document.body.append(audioDock);let k=w.toLowerCase(),a=articles[idx],pair=!fromSaved?a?.pairs.find(p=>(p[0].normalize('NFC').toLowerCase().match(/[\p{L}]+(?:-[\p{L}]+)?/gu)||[]).includes(k)):null,entry={...starterLex[k],...(!fromSaved?a?.lexicon?.[k]:null),...Object.fromEntries(Object.entries(saved[k]||{}).filter(([key,value])=>value!==''&&value!=null))},meaning=entry.meaning||(!fromSaved?a?.dict?.[k]:null)||basic[k]||'',example=pair?.[0]||entry.example||'',exampleCN=pair?.[1]||entry.exampleCN||'';detail.innerHTML=`<h2>${esc(w)}</h2><div class="bar"><button id="speakword" type="button">▶ 发音</button></div><p id="wordAudioStatus" role="status" class="muted">使用独立西语 MP3；未收录时显示待补齐。</p><p class="muted">${esc(entry.lemma||w)} · ${esc(entry.pos||'词性待补充')}</p><label>中文释义<input readonly id="meaning" value="${esc(meaning)}" placeholder="暂未收录"></label><label>English<input readonly id="worden" value="${esc(entry.en||'')}" placeholder="暂未收录"></label><label>Definición en español<textarea readonly id="wordes" placeholder="暂未收录">${esc(entry.es||'')}</textarea></label><p>${esc(example)}</p><p class="muted">${esc(exampleCN)}</p><div class="bar"><button type="button" id="editword">编辑释义</button><button id="saveword" class="primary">${saved[k]?'更新单词':'加入单词本'}</button>${saved[k]?'<button id="deleteword">删除</button>':''}</div>`;detail.querySelector('#speakword').onclick=()=>say(w);detail.querySelector('#editword').onclick=()=>{for(const id of ['meaning','worden','wordes'])detail.querySelector('#'+id).readOnly=false;detail.querySelector('#meaning').focus()};detail.querySelector('#saveword').onclick=()=>{let m=document.getElementById('meaning').value.trim();if(!m){alert('请填写释义');return}saved[k]={...entry,meaning:m,en:document.getElementById('worden').value.trim(),es:document.getElementById('wordes').value.trim(),example,exampleCN};write('holaWords',saved);modal.close();render()};let d=detail.querySelector('#deleteword');if(d)d.onclick=()=>{dele app.addEventListener('click',e=>{let sound=e.target.closest('[data-say]');if(sound){say(sound.dataset.say);return}let t=e.target.closest('[data-word],[data-saved]');if(t)lookup(t.dataset.word||t.dataset.saved,!!t.dataset.saved)});app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.word)lookup(e.target.dataset.word)});function grade(ok){let k=Object.keys(saved).find(k=>!saved[k].due||saved[k].due<=Date.now());if(!k)return;let s=saved[k];s.stage=ok?(s.stage||0)+1:0;s.due=Date.now()+(ok?[1,3,7,14,30][Math.min(s.stage-1,4)]*86400000:600000);write('holaWords',saved);reviewReveal=false;render()}function addArticle(){let title=document.getElementById('title').value.trim(),pairs=document.getElementById('pairs').value.trim().split('\n').filter(Boolean).map(l=>l.split('|').map(s=>s.trim())),dict=Object.fromEntries(document.getElementById('dict').value.split('\n').filter(l=>l.includes('|')).map(l=>l.split('|').map(s=>s.trim())));if(!title||!pairs.length||pairs.some(p=>p.length!==2||!p[0]||!p[1])){alert('请填写标题和正确的双语行');return}custom.push({title,level:document.getElementById('level').value,pairs,dict});write('holaCustom',custom);load();level='全部';go('home')}function backup(){let b=new Blob([JSON.stringify({version:3,saved,done,wrong,custom,studyRecords},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hola-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.saved||!Array.isArray(x.custom)||!Array.isArray(x.done)||!Array.isArray(x.wrong))throw Error();if(!confirm('恢复将覆盖当前学习记录，继续？'))return;saved=x.saved;custom=x.custom;if(x.studyRecords&&typeof x.studyRecords==='object'&&!Array.isArray(x.studyRecords)){studyRecords=x.studyRecords;write('holaStudy24',studyRecords)}done=x.done.map(i=>!x.version&&i>=12?i+8:i);wrong=x.wrong.map(i=>!x.version&&i>=12?i+8:i);for(let [k,v] of Object.entries({holaWords:saved,holaCu let studyLine=0,studyReveal=false,studyPeeked=false,studyResult=null,studyRepeat='3',studyRecords=read('holaStudy24',{});
function studyKey(a,i){return (a.id||a.title)+'|'+a.pairs[i][0]}
function studyRecord(a,i){return studyRecords[studyKey(a,i)]||{draft:'',attempts:0,best:0,passed:false}}
function updateStudyStatus(t){const e=document.getElementById('audioStatus');if(e)e.textContent=t}
function studyDraft(v){const a=articles[idx],k=studyKey(a,studyLine);studyRecords[k]={...studyRecord(a,studyLine),draft:v};write('holaStudy24',studyRecords)}
function wordsForDiff(t){return t.normalize('NFC').toLocaleLowerCase('es').match(/[\p{L}\p{N}]+/gu)||[]}
function compareWords(expected,actual){const e=wordsForDiff(expected),a=wordsForDiff(actual),d=Array.from({length:e.length+1},()=>Array(a.length+1).fill(0));for(let i=0;i<=e.length;i++)d[i][0]=i;for(let j=0;j<=a.length;j++)d[0][j]=j;for(let i=1;i<=e.length;i++)for(let j=1;j<=a.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(e[i-1]===a[j-1]?0:1));let i=e.length,j=a.length,ops=[];while(i||j){if(i&&j&&e[i-1]===a[j-1]&&d[i][j]===d[i-1][j-1]){ops.push(['hit',e[--i]]);j--}else if(i&&j&&d[i][j]===d[i-1][j-1]+1){ops.push(['miss',e[--i],a[--j]])}else if(i&&d[i][j]===d[i-1][j]+1){ops.push(['miss',e[--i],''])}else{ops.push(['extra',a[--j]])}}return {score:e.length?Math.max(0,Math.round(100*(1-d[e.length][a.length]/e.length))):0,ops:ops.reverse()}}
function checkStudy(){const a=articles[idx],k=studyKey(a,studyLine),r=studyRecord(a,studyLine);if(!r.draft.trim()){alert('先写下你听到的内容');return}studyResult=compareWords(a.pairs[studyLine][0],r.draft);studyRecords[k]={...r,attempts:r.attempts+1,best:Math.max(r.best,studyResult.score),passed:r.passed||(!studyPeeked&&studyResult.score===100)};write('holaStudy24',studyRecords);studyReveal=true;studyPeeked=true;stopAudio();render()}
function changeStudy(n){stopAudio();studyLine=Math.max(0,Math.min(articles[idx].pairs.length-1,n));studyReveal=false;studyPeeked=false;studyResult=null;render()}

function studyHtml(a){const p=a.pairs[studyLine],r=studyRecord(a,studyLine),passed=a.pairs.filter((_,i)=>studyRecord(a,i).passed).length;return `<div class="study"><div class="meta">逐句精听 · 第 ${studyLine+1}/${a.pairs.length} 句 · 独立听写通过 ${passed}/${a.pairs.length}</div><div class="study-progress"><span style="width:${passed/a.pairs.length*100}%"></span></div><p class="muted">先盲听，再听写；对照原文后跟读。标点和大小写不计错，重音符号计错。</p><div class="study-controls"><label>语速<select onchange="rate=Number(this.value);if(player)player.playbackRate=rate">${[.5,.65,.75,.8,.9,1,1.1,1.25,1.5].map(x=>`<option value="${x}" ${rate===x?'selected':''}>${x}x</option>`).join('')}</select></label><label>循环次数<select onchange="studyRepeat=this.value;stopAudio()">${['1','2','3','5','∞'].map(x=>`<option ${studyRepeat===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="bar"><button class="primary bigplay" onclick="startStudy()">▶ 播放本句</button><button onclick="stopAudio()">■ 停止</button></div><div id="audioStatus" class="muted">${(a.audio?.[studyLine]||sharedAudio.sentences?.[p[0].normalize('NFC').trim()])?'内置西语音频':'本句 MP3 待补齐'}</div><label for="dictation">听写</label><textarea id="dictation" maxlength="3000" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="studyDraft(this.value)" placeholder="Escribe lo que escuchas…">${esc(r.draft)}</textarea><div class="bar"><button class="primary" onclick="checkStudy()">检查听写</button><button onclick="studyReveal=!studyReveal;studyPeeked=true;studyResult=null;render()">${studyReveal?'隐藏原文':'查看原文'}</button></div>${studyResult?`<div class="answer"><strong>词级准确率 ${studyResult.score}%</strong><div class="diff">${studyResult.ops.map(o=>o[0]==='hit'?`<span class="hit">${esc(o[1])}</span>`:o[0]==='extra'?`<span class="extra">${esc(o[1])}</span>`:`<span class="miss">${o[2]?esc(o[2])+' → ':''}${esc(o[1])}</span>`).join(' ')}</div><small>红色：需改正或补写；划线：多写。已查看原文的作答不算独立通过。</small></div>`:''}${studyReveal?`<div class="answer"><p class="es">${tokens(p[0]
